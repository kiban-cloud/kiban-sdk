openapi: 3.0.0
info:
  contact: {}
  description: |-
    API pública de Link (Kiban): ejecuta un servicio de consulta/validación del catálogo Link (curp, sat, imss, nip, sms, buró de crédito, etc.), consulta su resultado y revisa el historial de ejecuciones.

    Link expone un conjunto de endpoints genéricos: el servicio a ejecutar se elige en la ruta con {service}/{subservice}. El cuerpo de la petición y la forma de la respuesta dependen del servicio elegido; cada servicio define sus propios campos. Consulta el catálogo de servicios para el detalle de cada uno.
    Todos los endpoints se autentican con el header x-api-key.

    Ambientes: producción en https://link.kiban.com y sandbox en https://sandbox.link.kiban.com. En sandbox la ejecución no llama al proveedor real: devuelve un test case configurable, para que puedas integrar el contrato del servicio sin costo ni credenciales reales.
  title: Link API
  version: "1.0"
servers:
- url: https://link.kiban.com
paths:
  /api/v{version}/{service}/{subservice}:
    get:
      description: Devuelve una página del historial de ejecuciones de un service/subservice.
        Cualquier query param adicional no listado aquí se interpreta como filtro
        de búsqueda sobre el listado (searchableBy).
      parameters:
      - description: Versión de la API (por ejemplo 1 o 2)
        explode: false
        in: path
        name: version
        required: true
        schema:
          type: string
        style: simple
      - description: Servicio del catálogo Link
        explode: false
        in: path
        name: service
        required: true
        schema:
          type: string
        style: simple
      - description: Operación del servicio
        explode: false
        in: path
        name: subservice
        required: true
        schema:
          type: string
        style: simple
      - description: "Número de página, empieza en 1"
        explode: true
        in: query
        name: page
        required: true
        schema:
          type: integer
        style: form
      - description: Cantidad de resultados por página
        explode: true
        in: query
        name: itemsPerPage
        required: true
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/controller_microservice_model.LinkExecutionPage"
          description: Página de ejecuciones
        "400":
          description: Query params de paginación ausentes o mal formados
        "401":
          description: API key ausente o inválida
        "403":
          description: La API key no tiene acceso al listado
        "500":
          description: Error interno
        "503":
          description: Servicio dependiente no disponible
      security:
      - ApiKeyAuth: []
      summary: Historial de ejecuciones de un servicio
      tags:
      - Link
      x-accepts:
      - application/json
    post:
      description: |-
        Ejecuta un servicio del catálogo Link (por ejemplo curp/validate, sat/pf_data_from_rfc, nip/send). El servicio y la operación se eligen en la ruta con {service}/{subservice}.
        El cuerpo de la petición depende del servicio elegido: cada servicio define sus propios campos. Consulta el catálogo de servicios para el detalle de cada uno.
        En sandbox no se llama al proveedor real; se devuelve un test case configurable.
      parameters:
      - description: Versión de la API (por ejemplo 1 o 2)
        explode: false
        in: path
        name: version
        required: true
        schema:
          type: string
        style: simple
      - description: "Servicio del catálogo Link (por ejemplo curp, sat, imss, nip,\
          \ sms)"
        explode: false
        in: path
        name: service
        required: true
        schema:
          type: string
        style: simple
      - description: "Operación del servicio (por ejemplo validate, send, pf_data_from_rfc)"
        explode: false
        in: path
        name: subservice
        required: true
        schema:
          type: string
        style: simple
      - description: "Identificador libre del origen de la petición, para atribució\
          n"
        explode: false
        in: header
        name: origin
        required: false
        schema:
          type: string
        style: simple
      - description: Si es true no llama al proveedor real y devuelve una respuesta
          mock
        explode: false
        in: header
        name: mock
        required: false
        schema:
          type: boolean
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: Cuerpo específico del servicio. Sus campos varían por service/subservice
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/controller_microservice_model.MicroserviceDetailDto"
          description: Ejecución realizada
        "400":
          description: Cuerpo inválido o campos requeridos ausentes para ese servicio
        "401":
          description: API key ausente o inválida
        "403":
          description: La API key no tiene acceso a ese servicio
        "406":
          description: El proveedor rechazó la petición
        "408":
          description: Tiempo de espera agotado con el proveedor
        "409":
          description: Conflicto al procesar la ejecución
        "500":
          description: Error interno
        "503":
          description: Servicio dependiente no disponible
      security:
      - ApiKeyAuth: []
      summary: Ejecutar un servicio de Link
      tags:
      - Link
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v{version}/{service}/{subservice}/{id}:
    get:
      description: "Devuelve el detalle de una ejecución: su estatus, la respuesta\
        \ procesada y el raw de las llamadas al proveedor (apiData)."
      parameters:
      - description: Versión de la API (por ejemplo 1 o 2)
        explode: false
        in: path
        name: version
        required: true
        schema:
          type: string
        style: simple
      - description: Servicio del catálogo Link
        explode: false
        in: path
        name: service
        required: true
        schema:
          type: string
        style: simple
      - description: Operación del servicio
        explode: false
        in: path
        name: subservice
        required: true
        schema:
          type: string
        style: simple
      - description: Id de la ejecución
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/controller_microservice_model.MicroserviceDetailDto"
          description: Detalle de la ejecución
        "400":
          description: Id ausente o mal formado
        "401":
          description: API key ausente o inválida
        "403":
          description: La API key no tiene acceso a esa ejecución
        "404":
          description: La ejecución no existe
        "500":
          description: Error interno
        "503":
          description: Servicio dependiente no disponible
      security:
      - ApiKeyAuth: []
      summary: Detalle de una ejecución
      tags:
      - Link
      x-accepts:
      - application/json
  /api/v{version}/{service}/{subservice}/test_case:
    get:
      description: "Devuelve los test cases configurados para un service/subservice.\
        \ En sandbox, la ejecución de ese servicio devuelve uno de estos test cases\
        \ en lugar de llamar al proveedor real."
      parameters:
      - description: Versión de la API (por ejemplo 1 o 2)
        explode: false
        in: path
        name: version
        required: true
        schema:
          type: string
        style: simple
      - description: Servicio del catálogo Link
        explode: false
        in: path
        name: service
        required: true
        schema:
          type: string
        style: simple
      - description: Operación del servicio
        explode: false
        in: path
        name: subservice
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/controller_test_case_model.TestCaseOutputMany"
                type: array
          description: Test cases del servicio
        "400":
          description: Service o subservice ausente
        "401":
          description: API key ausente o inválida
        "500":
          description: Error interno
      security:
      - ApiKeyAuth: []
      summary: Test cases de un servicio (sandbox)
      tags:
      - Link
      x-accepts:
      - application/json
  /api/v{version}/{service}/{subservice}/vault:
    post:
      description: "Verifica si un vault (credencial guardada) existe y es del tipo\
        \ correcto para el servicio. Devuelve status: valid, notValid o notFound."
      parameters:
      - description: Versión de la API (por ejemplo 1 o 2)
        explode: false
        in: path
        name: version
        required: true
        schema:
          type: string
        style: simple
      - description: Servicio del catálogo Link
        explode: false
        in: path
        name: service
        required: true
        schema:
          type: string
        style: simple
      - description: Operación del servicio
        explode: false
        in: path
        name: subservice
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller_microservice_model.VaultNameDto"
        description: Nombre del vault a validar
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: "Resultado de la validación: {\\\"status\\\": \\\"valid|notValid|notFound\\\
            \"}"
        "400":
          description: Cuerpo inválido
        "401":
          description: API key ausente o inválida
        "500":
          description: Error interno
      security:
      - ApiKeyAuth: []
      summary: Validar un vault
      tags:
      - Link
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/file:
    get:
      description: Descarga un archivo generado por una ejecución (por ejemplo un
        PDF o comprobante). La ruta del archivo se obtiene del detalle de la ejecución
        y se pasa en el query param path.
      parameters:
      - description: "Ruta del archivo, tal como viene en el detalle de la ejecució\
          n"
        explode: true
        in: query
        name: path
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: Contenido del archivo
        "400":
          description: Query param path ausente
        "401":
          description: API key ausente o inválida
        "500":
          description: Error interno
      security:
      - ApiKeyAuth: []
      summary: Descargar un archivo de una ejecución
      tags:
      - Link
      x-accepts:
      - application/octet-stream
