          httpCode: 6
        url: url
      properties:
        duration:
          type: integer
        events:
          items:
            $ref: "#/components/schemas/controller_microservice_model.ApiDataEventDto"
          nullable: true
          type: array
        files:
          items:
            $ref: "#/components/schemas/controller_microservice_model.ApiDataFileDto"
          nullable: true
          type: array
        request:
          $ref: "#/components/schemas/controller_microservice_model.ApiDataHttpDto"
        response:
          $ref: "#/components/schemas/controller_microservice_model.ApiDataHttpDto"
        url:
          type: string
      type: object
    controller_microservice_model.ApiDataEventDto:
      example:
        body: ""
        date: date
      properties:
        body: {}
        date:
          type: string
      type: object
    controller_microservice_model.ApiDataFileDto:
      example:
        content: content
        name: name
        path: path
      properties:
        content:
          description: |-
            Go serializa []byte como texto base64; sin el swaggertype el spec lo
            declararía como arreglo de enteros y los SDKs tipados no lo leerían.
          format: byte
          type: string
        name:
          type: string
        path:
          type: string
      type: object
    controller_microservice_model.ApiDataHttpDto:
      example:
        body: ""
        date: date
        headers:
          key: headers
        httpCode: 6
      properties:
        body: {}
