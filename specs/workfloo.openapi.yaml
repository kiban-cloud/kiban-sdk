openapi: 3.0.0
info:
  contact: {}
  description: |-
    API pública de Workfloo: ejecuta un workfloo, consulta su estatus y revisa el historial/detalle de ejecuciones.
    Todos los endpoints se autentican con el header x-api-key.

    Ambientes: producción en https://workfloo.kiban.com y sandbox en https://sandbox.workfloo.kiban.com.
    El host sandbox activa ese modo de forma implícita y tiene precedencia: ahí el query param sandbox se ignora.
    Desde el host de producción se puede forzar el modo sandbox por request con sandbox=true.
  title: Workfloo API
  version: '1.0'
paths:
  /api/v1/pool:
    post:
      description: Ejecuta un pool de workfloos a partir de su definición. En sandbox, sceneries mapea cada nodo/definición a su escenario de prueba.
      operationId: executePool
      parameters:
        - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde ya es implícito
          in: query
          name: sandbox
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/controller_pool_model.Execute'
        description: Definición del pool y escenarios
        required: true
      responses:
        '200':
          description: Ids del workfloo creado y su definición
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/controller_pool_model.ExecuteResponse'
        '400':
          description: Body inválido o faltan campos requeridos
        '401':
          description: API key ausente o inválida
        '403':
          description: Sin acceso al pool
        '404':
          description: La definición del pool no existe
        '409':
          description: Conflicto al ejecutar
        '500':
          description: Error interno
        '503':
          description: Servicio dependiente no disponible
      security:
        - ApiKeyAuth: []
      summary: Ejecutar un pool
      tags:
        - pool
  /api/v1/workfloo:
    get:
      description: |-
        Devuelve una página de ejecuciones envuelta en un objeto con currentPage/hasNextPage/items.
        Cualquier query param adicional no listado aquí se interpreta como filtro de búsqueda sobre el listado (searchableBy).
      operationId: listWorkfloos
      parameters:
        - description: Número de página, empieza en 1
          in: query
          name: page
          required: true
          schema:
            type: integer
        - description: Cantidad de resultados por página
          in: query
          name: itemsPerPage
          required: true
          schema:
            type: integer
        - description: Filtra por estado de la ejecución
          in: query
          name: status
          schema:
            type: string
        - description: Fecha inicial del rango (RFC3339)
          in: query
          name: from
          schema:
            type: string
        - description: Fecha final del rango (RFC3339)
          in: query
          name: to
          schema:
            type: string
        - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde ya es implícito
          in: query
          name: sandbox
          schema:
            type: boolean
      responses:
        '200':
          description: Página de ejecuciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/controller_workfloo_model.WorkflooPage'
        '400':
          description: Query params de paginación ausentes o mal formados
        '401':
          description: API key ausente o inválida
        '403':
          description: La API key no tiene acceso al listado
        '409':
          description: Conflicto al mapear los resultados
        '500':
          description: Error interno
        '503':
          description: Servicio dependiente no disponible
      security:
        - ApiKeyAuth: []
      summary: Historial de ejecuciones (v1)
      tags:
        - workfloo
    post:
      description: Crea y arranca una ejecución a partir de una definición de workfloo. Devuelve el id de la ejecución para consultar su estatus.
      operationId: executeWorkfloo
      parameters:
        - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde ya es implícito
          in: query
          name: sandbox
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/controller_workfloo_model.Execute'
        description: Definición a ejecutar y datos iniciales
        required: true
      responses:
        '200':
          description: Ejecución creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/controller_workfloo_model.ExecuteResponse'
        '400':
          description: Body inválido, faltan campos requeridos, o el primer nodo/validador rechazó los datos
        '401':
          description: API key ausente o inválida
        '403':
          description: La API key no tiene acceso a esa definición
        '404':
          description: La definición de workfloo no existe
        '409':
          description: Conflicto al crear la ejecución
        '500':
          description: Error interno
        '503':
          description: Servicio dependiente no disponible
      security:
        - ApiKeyAuth: []
      summary: Ejecutar un workfloo
      tags:
        - workfloo
  /api/v1/workfloo/{id}:
    get:
      description: 'Devuelve el historial completo de una ejecución: todos sus nodos con request/response, variables, documentos y decisiones.'
      operationId: getWorkfloo
      parameters:
        - description: Id de la ejecución
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde ya es implícito
          in: query
          name: sandbox
          schema:
            type: boolean
      responses:
        '200':
          description: Detalle de la ejecución
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/controller_workfloo_model.WorkflooResume'
        '400':
          description: Id ausente o mal formado
        '401':
          description: API key ausente o inválida
        '403':
          description: La API key no tiene acceso a esa ejecución
        '404':
          description: La ejecución no existe
        '409':
          description: Conflicto al mapear la ejecución
        '500':
          description: Error interno
        '503':
          description: Servicio dependiente no disponible
      security:
        - ApiKeyAuth: []
      summary: Detalle de una ejecución
      tags:
        - workfloo
  /api/v1/workfloo/{id}/correction:
    post:
      description: 'Reenvía los campos corregidos por el prospecto cuando un nodo VALIDATION está en estado CORRECTION. El body es un objeto {campoId: valor}, igual que el formulario.'
      operationId: submitWorkflooCorrection
      parameters:
        - description: Id de la ejecución
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde ya es implícito
          in: query
          name: sandbox
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: 'Campos corregidos: {campoId: valor}'
        required: true
      responses:
        '200':
          description: Corrección aceptada; la ejecución vuelve a revisión o avanza
        '400':
          description: Errores de validación por campo
        '401':
          description: API key ausente o inválida
        '403':
          description: Sin acceso a ese paso
        '404':
          description: La ejecución no existe
        '409':
          description: El paso no está en estado de corrección
        '500':
          description: Error interno
        '503':
          description: Servicio dependiente no disponible
      security:
        - ApiKeyAuth: []
      summary: Enviar la corrección de un paso de validación
      tags:
        - workfloo
  /api/v1/workfloo/{id}/document:
    post:
      description: 'Envía los documentos del nodo DOCUMENT actual. El body es un objeto {documentoId: base64} (los de tipo "set" van como arreglo de objetos).'
      operationId: executeWorkflooDocument
      parameters:
        - description: Id de la ejecución
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde ya es implícito
          in: query
          name: sandbox
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: 'Documentos: {documentoId: base64}'
        required: true
      responses:
        '200':
          description: Documentos aceptados; la ejecución avanza
        '400':
          description: Errores de validación por documento (formato/tamaño) o de conectores validadores
        '401':
          description: API key ausente o inválida
        '403':
          description: Sin acceso a ese paso
        '404':
          description: La ejecución no existe
        '409':
          description: Conflicto de estado
        '500':
          description: Error interno
        '503':
          description: Servicio dependiente no disponible
      security:
        - ApiKeyAuth: []
      summary: Enviar los documentos de un paso
      tags:
        - workfloo
  /api/v1/workfloo/{id}/file:
    get:
      description: Devuelve, en base64, un archivo producido/subido en un nodo de la ejecución, identificado por nodeId + name.
      operationId: getWorkflooFile
      parameters:
        - description: Id de la ejecución
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Id del nodo que contiene el archivo
          in: query
          name: nodeId
          required: true
          schema:
            type: string
        - description: Nombre del archivo
          in: query
          name: name
          required: true
          schema:
            type: string
        - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde ya es implícito
          in: query
          name: sandbox
          schema:
            type: boolean
      responses:
        '200':
          description: Archivo en base64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/controller_workfloo_model.FileResponse'
        '400':
          description: Parámetros ausentes o mal formados
        '401':
          description: API key ausente o inválida
        '403':
          description: Sin acceso a esa ejecución
        '404':
          description: La ejecución, el nodo o el archivo no existe
        '500':
          description: Error interno
        '503':
          description: Servicio dependiente no disponible
      security:
        - ApiKeyAuth: []
      summary: Descargar un archivo de un nodo
      tags:
        - workfloo
  /api/v1/workfloo/{id}/form:
    post:
      description: 'Envía las respuestas del nodo FORM actual de la ejecución. El body es un objeto {campoId: valor} con los campos del formulario.'
      operationId: executeWorkflooForm
      parameters:
        - description: Id de la ejecución
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde ya es implícito
          in: query
          name: sandbox
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: 'Campos del formulario: {campoId: valor}'
        required: true
      responses:
        '200':
          description: Formulario aceptado; la ejecución avanza
        '400':
          description: Errores de validación por campo o de conectores validadores
        '401':
          description: API key ausente o inválida
        '403':
          description: Sin acceso a ese paso
        '404':
          description: La ejecución no existe
        '409':
          description: Conflicto de estado
        '500':
          description: Error interno
        '503':
          description: Servicio dependiente no disponible
      security:
        - ApiKeyAuth: []
      summary: Enviar el formulario de un paso
      tags:
        - workfloo
  /api/v1/workfloo/{id}/nip/resend:
    patch:
      description: Reenvía el NIP y devuelve el estado del flujo NIP. El body es opcional (teléfono al que reenviar).
      operationId: resendWorkflooNip
      parameters:
        - description: Id de la ejecución
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde ya es implícito
          in: query
          name: sandbox
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/controller_workfloo_model.NipResendRequest'
        description: Teléfono al que reenviar (opcional)
      responses:
        '200':
          description: Estado del NIP tras reenviar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/controller_workfloo_model.NipResendStatus'
        '400':
          description: Teléfono/country code inválidos o error de negocio
        '401':
          description: API key ausente o inválida
        '403':
          description: Sin acceso a esa ejecución
        '404':
          description: La ejecución no existe
        '500':
          description: Error interno
        '503':
          description: Servicio dependiente no disponible
      security:
        - ApiKeyAuth: []
      summary: Reenviar el NIP
      tags:
        - workfloo
  /api/v1/workfloo/{id}/nip/send:
    patch:
      description: Envía el NIP (código de un solo uso) del nodo NIP actual. El body es opcional; si se incluye teléfono, countryCode y phoneNumber van juntos.
      operationId: sendWorkflooNip
      parameters:
        - description: Id de la ejecución
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde ya es implícito
          in: query
          name: sandbox
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/controller_workfloo_model.NipSendRequest'
        description: Teléfono al que enviar el NIP (opcional)
      responses:
        '200':
          description: NIP enviado
        '400':
          description: Teléfono/country code inválidos o error de negocio
        '401':
          description: API key ausente o inválida
        '403':
          description: Sin acceso a esa ejecución
        '404':
          description: La ejecución no existe
        '500':
          description: Error interno
        '503':
          description: Servicio dependiente no disponible
      security:
        - ApiKeyAuth: []
      summary: Enviar el NIP
      tags:
        - workfloo
  /api/v1/workfloo/{id}/nip/validate:
    patch:
      description: Valida el NIP capturado por el usuario y devuelve la fase resultante del flujo NIP.
      operationId: validateWorkflooNip
      parameters:
        - description: Id de la ejecución
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde ya es implícito
          in: query
          name: sandbox
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/controller_workfloo_model.NipValidateRequest'
        description: El NIP a validar
        required: true
      responses:
        '200':
          description: Fase resultante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/controller_workfloo_model.NipValidateResponse'
        '400':
          description: NIP ausente o incorrecto
        '401':
          description: API key ausente o inválida
        '403':
          description: NIP rechazado / sin acceso
        '404':
          description: La ejecución no existe
        '500':
          description: Error interno
        '503':
          description: Servicio dependiente no disponible
      security:
        - ApiKeyAuth: []
      summary: Validar el NIP
      tags:
        - workfloo
  /api/v1/workfloo/{id}/review:
    post:
      description: 'Aplica la decisión del revisor sobre un nodo VALIDATION en estado REVIEW: aprobar o rechazar. En un rechazo, reviews indica los campos a corregir con su mensaje.'
      operationId: reviewWorkflooValidation
      parameters:
        - description: Id de la ejecución
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde ya es implícito
          in: query
          name: sandbox
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/controller_workfloo_model.ReviewRequest'
        description: Decisión del revisor
        required: true
      responses:
        '200':
          description: Decisión aplicada; la ejecución avanza o pasa a corrección
        '400':
          description: Body inválido
        '401':
          description: API key ausente o inválida
        '403':
          description: Sin acceso a ese paso de revisión
        '404':
          description: La ejecución no existe
        '409':
          description: El paso no está en estado revisable
        '500':
          description: Error interno
        '503':
          description: Servicio dependiente no disponible
      security:
        - ApiKeyAuth: []
      summary: Revisar un paso de validación
      tags:
        - workfloo
  /api/v1/workfloo/status/{id}:
    get:
      description: |-
        Devuelve el estado actual de la ejecución y el paso en el que está parada, con el payload que ese paso espera (formulario, documento, NIP, timer o corrección).
        Cuando el paso está procesando, currentNodeType lleva el sufijo _PROCESSING y el payload se omite.
      operationId: getWorkflooStatus
      parameters:
        - description: Id de la ejecución
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde ya es implícito
          in: query
          name: sandbox
          schema:
            type: boolean
      responses:
        '200':
          description: Estatus de la ejecución
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/controller_workfloo_model.WorkflooStatus'
        '400':
          description: Id ausente o mal formado
        '401':
          description: API key ausente o inválida
        '403':
          description: La API key no tiene acceso a esa ejecución
        '404':
          description: La ejecución no existe
        '409':
          description: Conflicto al mapear el estatus
        '500':
          description: Error interno
        '503':
          description: Servicio dependiente no disponible
      security:
        - ApiKeyAuth: []
      summary: Estatus de una ejecución
      tags:
        - workfloo
  /api/v2/workfloo:
    get:
      description: |-
        Igual que v1 pero devuelve el arreglo de ejecuciones directo, sin envoltorio. La paginación viaja en el header Link.
        Con format=csv la respuesta es un archivo CSV en lugar de JSON.
        Cualquier query param adicional no listado aquí se interpreta como filtro de búsqueda sobre el listado (searchableBy).
      operationId: listWorkfloosV2
      parameters:
        - description: Número de página, empieza en 1
          in: query
          name: page
          schema:
            type: integer
        - description: Cantidad de resultados por página
          in: query
          name: itemsPerPage
          schema:
            type: integer
        - description: Filtra por estado de la ejecución
          in: query
          name: status
          schema:
            type: string
        - description: Fecha inicial del rango (RFC3339)
          in: query
          name: from
          schema:
            type: string
        - description: Fecha final del rango (RFC3339)
          in: query
          name: to
          schema:
            type: string
        - description: Formato de la respuesta
          in: query
          name: format
          schema:
            type: string
            enum:
              - json
              - csv
        - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde ya es implícito
          in: query
          name: sandbox
          schema:
            type: boolean
      responses:
        '200':
          description: Arreglo de ejecuciones. El header Link trae las páginas siguiente/anterior
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/controller_workfloo_model.Workfloo'
                type: array
            text/csv:
              schema:
                items:
                  $ref: '#/components/schemas/controller_workfloo_model.Workfloo'
                type: array
          headers:
            Link:
              description: Enlaces de paginación RFC 5988 (rel="next" / rel="prev"). Vacío si no hay más páginas.
              schema:
                type: string
        '400':
          description: Query params de paginación mal formados
        '401':
          description: API key ausente o inválida
        '403':
          description: La API key no tiene acceso al listado
        '409':
          description: Conflicto al mapear los resultados
        '500':
          description: Error interno
        '503':
          description: Servicio dependiente no disponible
      security:
        - ApiKeyAuth: []
      summary: Historial de ejecuciones (v2)
      tags:
        - workfloo
servers:
  - url: https://workfloo.kiban.com
    description: Producción
  - url: https://sandbox.workfloo.kiban.com
    description: Sandbox. Activa el modo sandbox implícitamente; el query param sandbox se ignora en este host.
components:
  securitySchemes:
    ApiKeyAuth:
      description: API key del espacio. Se envía en cada request; nunca se hardcodea en el cliente.
      in: header
      name: x-api-key
      type: apiKey
  schemas:
    controller_pool_model.Execute:
      properties:
        idPoolDefinition:
          type: string
        sceneries:
          additionalProperties:
            type: string
          type: object
      required:
        - idPoolDefinition
      type: object
    controller_pool_model.ExecuteResponse:
      properties:
        idWorkfloo:
          type: string
        idWorkflooDefinition:
          type: string
      type: object
    controller_workfloo_definition_model.AutoFilledBy:
      properties:
        nameNode:
          type: string
        nodeId:
          type: string
      type: object
    controller_workfloo_definition_model.Document:
      properties:
        documentField:
          items:
            $ref: '#/components/schemas/controller_workfloo_definition_model.FileDocument'
          type: array
      type: object
    controller_workfloo_definition_model.Field:
      properties:
        fieldMetadata:
          $ref: '#/components/schemas/controller_workfloo_definition_model.FieldMetadata'
        id:
          type: string
        name:
          type: string
        predefined:
          type: boolean
        required:
          type: boolean
        section:
          type: string
        set:
          $ref: '#/components/schemas/controller_workfloo_definition_model.SetData'
        showIf:
          items:
            $ref: '#/components/schemas/controller_workfloo_definition_model.ShowIf'
          type: array
      type: object
    controller_workfloo_definition_model.FieldMetadata:
      properties:
        autoFilledBy:
          items:
            $ref: '#/components/schemas/controller_workfloo_definition_model.AutoFilledBy'
          type: array
        autofillNodeId:
          type: string
        defaultValue: {}
        html:
          type: string
        map:
          additionalProperties:
            type: string
          type: object
        max:
          type: integer
        maxLength:
          type: integer
        maxVal:
          type: number
        min:
          type: integer
        minLength:
          type: integer
        minVal:
          type: number
        regex:
          type: string
        regexMessage:
          type: string
        show:
          $ref: '#/components/schemas/controller_workfloo_definition_model.Show'
        type:
          type: string
      type: object
    controller_workfloo_definition_model.FileDocument:
      properties:
        fileMetadata:
          $ref: '#/components/schemas/controller_workfloo_definition_model.FileMetadata'
        id:
          type: string
        name:
          type: string
        predefined:
          type: boolean
        required:
          type: boolean
        set:
          $ref: '#/components/schemas/controller_workfloo_definition_model.SetDataDocument'
      type: object
    controller_workfloo_definition_model.FileDocumentSet:
      properties:
        fileMetadata:
          $ref: '#/components/schemas/controller_workfloo_definition_model.FileMetadata'
        id:
          type: string
        name:
          type: string
        predefined:
          type: boolean
        required:
          type: boolean
      type: object
    controller_workfloo_definition_model.FileMetadata:
      properties:
        formats:
          items:
            type: string
          type: array
        max:
          type: integer
        maxSize:
          type: integer
        min:
          type: integer
      type: object
    controller_workfloo_definition_model.Form:
      properties:
