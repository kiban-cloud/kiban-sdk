        "403":
          description: Sin acceso a esa ejecución
        "404":
          description: La ejecución no existe
        "500":
          description: Error interno
        "503":
          description: Servicio dependiente no disponible
      security:
      - ApiKeyAuth: []
      summary: Reenviar el NIP
