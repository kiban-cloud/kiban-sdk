          a mano desde la consola. Una ABANDONED por expiración del sistema no los
          trae, y son lo único que distingue un caso del otro (el status es el
          mismo). CancelledAt es *time.Time porque el omitempty de encoding/json
          NO omite un struct en cero: un time.Time plano emitiría siempre
          "0001-01-01T00:00:00Z" (mismo patrón que NodeDetail.DateFound).
        type: string
