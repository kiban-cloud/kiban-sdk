      status:
        type: string
      timer:
        $ref: '#/definitions/controller_workfloo_model.Timer'
      validation:
        $ref: '#/definitions/controller_workfloo_model.ValidationStatus'
      verification:
        allOf:
        - $ref: '#/definitions/controller_workfloo_model.VerificationStatus'
        description: |-
          Verification aparece SÓLO cuando la ejecución está esperando que alguien
          teclee un código. Su ausencia es lo que le dice al integrador que no hay
          nada pendiente de ese lado.
    type: object
host: workfloo.kiban.com
info:
  contact: {}
  description: |-
    API pública de Workfloo: ejecuta un workfloo, consulta su estatus y revisa el historial/detalle de ejecuciones.
    Todos los endpoints se autentican con el header x-api-key.

    Ambientes: producción en https://workfloo.kiban.com y sandbox en https://sandbox.workfloo.kiban.com.
    El host sandbox activa ese modo de forma implícita y tiene precedencia: ahí el query param sandbox se ignora.
    Desde el host de producción se puede forzar el modo sandbox por request con sandbox=true.
  title: Workfloo API
  version: "1.0"
paths:
  /api/v1/pool:
    post:
      consumes:
      - application/json
      description: Ejecuta un pool de workfloos a partir de su definición. En sandbox,
        sceneries mapea cada nodo/definición a su escenario de prueba.
      operationId: executePool
      parameters:
      - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde
          ya es implícito
        in: query
        name: sandbox
        type: boolean
      - description: Definición del pool y escenarios
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller_pool_model.Execute'
      produces:
      - application/json
      responses:
        "200":
          description: Ids del workfloo creado y su definición
          schema:
            $ref: '#/definitions/controller_pool_model.ExecuteResponse'
        "400":
          description: Body inválido o faltan campos requeridos
        "401":
          description: API key ausente o inválida
        "403":
          description: Sin acceso al pool
        "404":
          description: La definición del pool no existe
        "409":
          description: Conflicto al ejecutar
        "500":
          description: Error interno
        "503":
          description: Servicio dependiente no disponible
      security:
      - ApiKeyAuth: []
      summary: Ejecutar un pool
      tags:
      - pool
  /api/v1/workfloo:
    get:
      description: |-
        Devuelve una página de ejecuciones envuelta en un objeto con currentPage/hasNextPage/items.
        Cualquier query param adicional no listado aquí se interpreta como filtro de búsqueda sobre el listado (searchableBy).
      operationId: listWorkfloos
      parameters:
      - description: Número de página, empieza en 1
        in: query
        name: page
        required: true
        type: integer
      - description: Cantidad de resultados por página
        in: query
        name: itemsPerPage
        required: true
        type: integer
      - description: Filtra por estado de la ejecución
        in: query
        name: status
        type: string
      - description: Fecha inicial del rango (RFC3339)
        in: query
        name: from
        type: string
      - description: Fecha final del rango (RFC3339)
        in: query
        name: to
        type: string
      - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde
          ya es implícito
        in: query
        name: sandbox
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Página de ejecuciones
          schema:
            $ref: '#/definitions/controller_workfloo_model.WorkflooPage'
        "400":
