        es opcional; si se incluye teléfono, countryCode y phoneNumber van juntos.
      operationId: sendWorkflooNip
      parameters:
      - description: Id de la ejecución
        in: path
        name: id
        required: true
        type: string
      - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde
          ya es implícito
        in: query
        name: sandbox
        type: boolean
      - description: Teléfono al que enviar el NIP (opcional)
        in: body
        name: body
        schema:
          $ref: '#/definitions/controller_workfloo_model.NipSendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: NIP enviado
        "400":
          description: Teléfono/country code inválidos o error de negocio
        "401":
          description: API key ausente o inválida
        "403":
          description: Sin acceso a esa ejecución
        "404":
          description: La ejecución no existe
        "500":
