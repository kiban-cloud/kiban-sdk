  /api/v1/workfloo/{id}/nip/validate:
    patch:
      consumes:
      - application/json
      description: Valida el NIP capturado por el usuario y devuelve la fase resultante
        del flujo NIP.
      operationId: validateWorkflooNip
      parameters:
      - description: Id de la ejecución
        in: path
        name: id
        required: true
        type: string
      - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde
          ya es implícito
        in: query
        name: sandbox
        type: boolean
      - description: El NIP a validar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller_workfloo_model.NipValidateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Fase resultante
          schema:
            $ref: '#/definitions/controller_workfloo_model.NipValidateResponse'
        "400":
          description: NIP ausente o incorrecto
        "401":
          description: API key ausente o inválida
        "403":
          description: NIP rechazado / sin acceso
        "404":
          description: La ejecución no existe
        "500":
          description: Error interno
        "503":
          description: Servicio dependiente no disponible
      security:
      - ApiKeyAuth: []
      summary: Validar el NIP
      tags:
      - workfloo
  /api/v1/workfloo/{id}/otp/fallback:
    patch:
      description: Pide al proveedor una validación nueva (y un código nuevo) para
        el paso de verificación. Cada reenvío es una consulta facturada y el número
        de reenvíos lo limita el nodo; al agotarlos responde 400/403 con `{"error"}`.
      operationId: fallbackWorkflooOtp
      parameters:
      - description: Id de la ejecución
        in: path
        name: id
        required: true
        type: string
      - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde
          ya es implícito
        in: query
        name: sandbox
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Código reenviado
        "400":
          description: Reenvíos agotados o error de negocio
        "401":
          description: API key ausente o inválida
        "403":
          description: Sin código pendiente, sin reenvíos, sin acceso, o la ejecución
            siguió ocupada procesando otro paso tras ~4.5 s de espera
        "404":
          description: La ejecución no existe
        "500":
          description: Error interno (incluye otra petición tomando la ejecución en
            el mismo instante; reintentar)
        "503":
          description: Servicio dependiente no disponible
      security:
      - ApiKeyAuth: []
      summary: Reenviar el código de verificación (OTP)
      tags:
      - workfloo
  /api/v1/workfloo/{id}/otp/validate:
    patch:
      consumes:
      - application/json
      description: Envía al proveedor el código que tecleó la persona en el paso de
        verificación (ver `verification` en el estatus). Un código incorrecto con
        intentos restantes responde 400 con `{"error", "remainingRetries"}` y la ejecución
        sigue estacionada; al agotar los intentos responde 403, salvo que el nodo
        tenga rama de error, en cuyo caso el flujo continúa por ahí y responde 200.
      operationId: validateWorkflooOtp
      parameters:
      - description: Id de la ejecución
        in: path
        name: id
        required: true
        type: string
      - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde
          ya es implícito
        in: query
        name: sandbox
        type: boolean
      - description: El código a validar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller_workfloo_model.OtpValidateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Código validado (o intentos agotados con rama de error)
        "400":
          description: Token ausente o código incorrecto (incluye remainingRetries)
        "401":
          description: API key ausente o inválida
        "403":
          description: Sin código pendiente, intentos agotados, sin acceso, o la ejecución
            siguió ocupada procesando otro paso tras ~4.5 s de espera
        "404":
          description: La ejecución no existe
        "500":
          description: Error interno (incluye otra petición tomando la ejecución en
            el mismo instante; reintentar)
        "503":
          description: Servicio dependiente no disponible
      security:
      - ApiKeyAuth: []
      summary: Validar el código de verificación (OTP)
      tags:
      - workfloo
  /api/v1/workfloo/{id}/review:
    post:
      consumes:
      - application/json
      description: 'Aplica la decisión del revisor sobre un nodo VALIDATION en estado
        REVIEW: aprobar o rechazar. En un rechazo, reviews indica los campos a corregir
        con su mensaje.'
      operationId: reviewWorkflooValidation
      parameters:
      - description: Id de la ejecución
        in: path
        name: id
        required: true
        type: string
      - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde
          ya es implícito
        in: query
        name: sandbox
        type: boolean
      - description: Decisión del revisor
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller_workfloo_model.ReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Decisión aplicada; la ejecución avanza o pasa a corrección
        "400":
          description: Body inválido
        "401":
          description: API key ausente o inválida
        "403":
          description: Sin acceso a ese paso de revisión
        "404":
          description: La ejecución no existe
        "409":
          description: El paso no está en estado revisable
        "500":
          description: Error interno
        "503":
          description: Servicio dependiente no disponible
      security:
      - ApiKeyAuth: []
      summary: Revisar un paso de validación
      tags:
      - workfloo
  /api/v1/workfloo/status/{id}:
    get:
      description: |-
        Devuelve el estado actual de la ejecución y el paso en el que está parada, con el payload que ese paso espera (formulario, documento, NIP, timer o corrección).
        Cuando el paso está procesando, currentNodeType lleva el sufijo _PROCESSING y el payload se omite.
      operationId: getWorkflooStatus
      parameters:
      - description: Id de la ejecución
        in: path
        name: id
        required: true
        type: string
      - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde
          ya es implícito
        in: query
        name: sandbox
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Estatus de la ejecución
          schema:
            $ref: '#/definitions/controller_workfloo_model.WorkflooStatus'
        "400":
          description: Id ausente o mal formado
        "401":
          description: API key ausente o inválida
        "403":
          description: La API key no tiene acceso a esa ejecución
        "404":
          description: La ejecución no existe
        "409":
          description: Conflicto al mapear el estatus
        "500":
          description: Error interno
        "503":
          description: Servicio dependiente no disponible
      security:
      - ApiKeyAuth: []
      summary: Estatus de una ejecución
      tags:
      - workfloo
  /api/v2/workfloo:
    get:
      description: |-
        Devuelve el arreglo de ejecuciones directo, sin envoltorio. La paginación viaja en el header Link.
        content=true agrega a cada elemento la ejecución completa, con todos sus nodos (la misma forma que getWorkfloo); por defecto es false y llega el resumen.
        format=CSV devuelve un archivo CSV en lugar de JSON. Los SDKs tipan la respuesta como JSON: para el CSV hay que leer el cuerpo crudo de la respuesta.
        Cualquier query param adicional no listado aquí se interpreta como filtro de búsqueda sobre el listado (searchableBy).
      operationId: listWorkfloosV2
      parameters:
      - description: Número de página, empieza en 1
        in: query
        name: page
        type: integer
      - description: Cantidad de resultados por página, entre 1 y 10000
        in: query
        name: itemsPerPage
        type: integer
      - description: Fecha inicial del rango (ISO 8601)
        in: query
        name: from
        type: string
      - description: Fecha final del rango (ISO 8601)
        in: query
        name: to
        type: string
      - description: 'Origen de la ejecución: KIBAN_CLOUD, API o FRONT'
        in: query
        name: origin
        type: string
      - description: 'Estado de la ejecución: SUCCESS, ERROR o PROGRESS'
        in: query
        name: status
        type: string
      - description: Nombre del workfloo (búsqueda parcial)
        in: query
        name: name
        type: string
      - description: Id exacto de la ejecución
        in: query
        name: _id
        type: string
      - description: RFC de persona física (empieza con, sin distinguir mayúsculas)
        in: query
        name: nodes.form.searchableBy.rfc_pf
        type: string
      - description: Nombre (empieza con, sin distinguir mayúsculas)
        in: query
        name: nodes.form.searchableBy.first_name
        type: string
      - description: Segundo nombre (empieza con, sin distinguir mayúsculas)
        in: query
        name: nodes.form.searchableBy.second_name
        type: string
      - description: Apellido paterno (empieza con, sin distinguir mayúsculas)
        in: query
        name: nodes.form.searchableBy.last_name_1
        type: string
      - description: Apellido materno (empieza con, sin distinguir mayúsculas)
        in: query
        name: nodes.form.searchableBy.last_name_2
        type: string
      - description: RFC de persona moral (empieza con, sin distinguir mayúsculas)
        in: query
        name: nodes.form.searchableBy.rfc_pm
        type: string
      - description: Razón social (empieza con, sin distinguir mayúsculas)
        in: query
        name: nodes.form.searchableBy.company_name
        type: string
      - description: Formato de la respuesta; por defecto JSON
        enum:
        - JSON
        - CSV
        in: query
        name: format
        type: string
      - description: Agrega la ejecución completa (todos sus nodos) a cada elemento;
          por defecto false
        in: query
        name: content
        type: boolean
      - description: Etiquetas, separadas por punto y coma
        in: query
        name: labels
        type: string
      - description: Fuerza el ambiente sandbox. Se ignora en el host sandbox, donde
          ya es implícito
        in: query
        name: sandbox
        type: boolean
      produces:
      - application/json
      - text/csv
      responses:
        "200":
          description: Arreglo de ejecuciones. El header Link trae las páginas siguiente/anterior
          schema:
            items:
              $ref: '#/definitions/controller_workfloo_model.WorkflooListItem'
            type: array
        "400":
          description: Query params de paginación mal formados
        "401":
          description: API key ausente o inválida
        "403":
          description: La API key no tiene acceso al listado
        "409":
          description: Conflicto al mapear los resultados
        "500":
          description: Error interno
        "503":
          description: Servicio dependiente no disponible
      security:
      - ApiKeyAuth: []
      summary: Historial de ejecuciones (v2)
      tags:
      - workfloo
schemes:
- https
securityDefinitions:
  ApiKeyAuth:
    description: API key del espacio. Se envía en cada request; nunca se hardcodea
      en el cliente.
    in: header
    name: x-api-key
    type: apiKey
swagger: "2.0"
