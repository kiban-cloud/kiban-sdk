# Regenera el spec, los 5 SDKs y las docs de un módulo, y abre (o actualiza) el PR.
#
# Corre cuando llega un push a la rama regenerate/<módulo> (workfloo, link). Ese
# push lo hace el backend del módulo (kiban-cloud/workfloo, kiban-cloud/link) con
# su .github/workflows/sdk-sync.yml: al cambiar su docs/swagger.yaml en main,
# copia el archivo a specs/source/<módulo>.swagger.yaml de esta rama.
# También corre si una persona empuja a la rama, por ejemplo para subir la
# versión en config/modules.json: el commit regenerado sale ya con la versión
# nueva.
#
# Este repo es PÚBLICO y no tiene credenciales hacia nada privado: no lee código
# del backend, sólo el swagger que el backend decidió publicar. Todo lo hace con
# su propio GITHUB_TOKEN. Los commits que hace ese token no vuelven a disparar
# este workflow, así que no hay ciclo.
#
# Nadie edita packages/** a mano: si el PR trae algo raro, se corrige la
# anotación swaggo en el backend, no el SDK generado. El PR NO sube la versión
# solo: el bump de semver se decide al revisarlo (ver README → Versionado), y el
# commit status "semver" dice cuál exige el cambio. Un bump empujado a esta rama
# sobrevive a los syncs siguientes: el backend construye encima de la rama
# existente, sin force-push.
#
# Requisito: Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests".
name: regenerate

on:
  push:
    branches: [regenerate/workfloo, regenerate/link]
  workflow_dispatch:
    inputs:
      module:
        description: Módulo a regenerar (su rama regenerate/<módulo> tiene que existir)
        required: true
        default: workfloo
        type: choice
        options: [workfloo, link]

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: regenerate-${{ inputs.module || github.ref_name }}
  cancel-in-progress: true

env:
  # En push, la rama que llegó (regenerate/<módulo>); a mano, el módulo elegido.
  TRIGGER: ${{ inputs.module || github.ref_name }}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # MODULE lo leen gen-spec.sh y gen-sdks.sh.
      - name: Módulo y rama
        id: mod
        run: |
          MODULE="${TRIGGER#regenerate/}"
          echo "module=$MODULE" >> "$GITHUB_OUTPUT"
          echo "MODULE=$MODULE" >> "$GITHUB_ENV"
          echo "BRANCH=regenerate/$MODULE" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: regenerate/${{ steps.mod.outputs.module }}
          fetch-depth: 0 # los tags de release son la base del check de semver

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Instalar oasdiff
        run: go install github.com/oasdiff/oasdiff@v1.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Regenerar spec
        run: bash scripts/gen-spec.sh

      - name: Regenerar SDKs
        run: bash scripts/gen-sdks.sh

      - name: Regenerar docs
        run: npm run docs

      # Chequeo barato de que lo generado compila antes de abrir el PR, y de que
      # los ejemplos siguen funcionando contra el SDK nuevo. Java y C# se
      # validan al revisar (ver README → Verificar).
      - name: Compilar Node y Go (SDK y ejemplos)
        run: |
          DIR="$(node -p "require('./config/modules.json').modules['$MODULE'].packagesDir")"
          ( cd "$DIR/node" && npm install --no-audit --no-fund && npx tsc --noEmit -p . )
          ( cd "$DIR/go" && go build ./... )
          # Los ejemplos de examples/ son de workfloo.
          if [ "$MODULE" = workfloo ]; then
            node --check examples/node/flujo-completo.mjs
            ( cd examples/go && go build ./... )
          fi

      - name: Commit de lo regenerado
        run: |
          git add specs packages docs
          if git diff --cached --quiet; then
            echo "Nada que regenerar: el spec no cambió."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore($MODULE): regenerar spec, SDKs y docs"
          git push origin "HEAD:${BRANCH}"

      - name: Abrir el PR si no existe
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" != "0" ]; then
            echo "El PR ya existe; quedó actualizado con este push."
            exit 0
          fi
          git fetch --quiet origin "$BASE"
          if git diff --quiet "origin/${BASE}" HEAD -- specs packages docs; then
            echo "Sin diferencias contra ${BASE}: no hace falta PR."
            exit 0
          fi
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "chore($MODULE): regenerar spec y SDKs" \
            --body "$(cat <<BODY
          Regeneración automática a partir del \`docs/swagger.yaml\` de \`kiban-cloud/$MODULE@main\`
          (copiado a \`specs/source/$MODULE.swagger.yaml\`).

          - [ ] Revisar el diff de \`specs/$MODULE.openapi.yaml\` (es el contrato).
          - [ ] Subir la versión en \`config/modules.json\` según semver. El status
                **semver** de este PR dice cuál exige el cambio (incompatible → major;
                cualquier otro cambio en el contrato → minor). Empujar a esta rama:
                el workflow regenera con la versión nueva.
          - [ ] Compilar Java y C# (README → Verificar).

          \`packages/**\` es 100% generado: no se edita a mano.
          BODY
          )"

      # Al final: el commit del bot no dispara semver.yml, así que el status se
      # publica aquí, sobre el último commit de la rama.
      - name: Versión según semver
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/semver-status.sh "$(git rev-parse HEAD)"
